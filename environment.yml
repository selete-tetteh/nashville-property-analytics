  - r-irkernel
  - pip
  - pip:
    - python-dotenv
    - pandas
    - sqlalchemy
    - pymysql
    - requests
    - matplotlib
    - seaborn
    - scipy
    - numpy
    - openpyxl
    - prophet
    - scikit-learn
    - geopandas
    - ipywidgets
